[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "android-auto-screengrabs"
version = "0.5.0"
description = "Deterministic Android capture-to-publish pipelines"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Pedro Veloso" }]
maintainers = [{ name = "Pedro Veloso", email = "pedro.n.veloso@gmail.com" }]
dependencies = [
  "httpx>=0.28,<1",
  "pillow>=11,<13",
  "platformdirs>=4.3,<5",
  "pydantic>=2.10,<3",
  "pyyaml>=6.0,<7",
  "rich>=13.9,<15",
  "typer>=0.15,<1",
]

[project.scripts]
aasg = "aasg.cli:app"

[dependency-groups]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "types-pyyaml>=6.0,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aasg"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=aasg --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["aasg"]
